name: Deploy Closed Testing

# `push` on main, not `pull_request_target`.
#
# The two fire at the same moment for this repo's PR-merge flow, but
# `pull_request_target` runs in the *elevated* context: the job gets the
# repository's secrets — ANDROID_KEYSTORE_BASE64, PLAY_SERVICE_ACCOUNT_JSON —
# and a write-scoped token, and then runs Gradle over code the PR author
# contributed (`android/build.gradle.kts`, `settings.gradle.kts`, the pubspec).
# The only thing standing between a fork PR with a `doLast { }` in it and the
# upload keystore was a maintainer pressing Merge — and per the comment in
# app/android/app/build.gradle.kts that key "can never be replaced or recovered
# if lost or leaked". `push` gives identical behaviour for a merge without
# opting into the elevated event at all.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: play-alpha-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Third-party actions are pinned by commit SHA, not by tag: a tag is
      # mutable, and both of these run with the deployment secrets in scope
      # (this one before the build, upload-google-play with the Play service
      # account handed to it directly and the decoded keystore still on disk).
      # Repointing a tag would be enough to take them.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.21.0
        with:
          flutter-version: "3.32.8"
          channel: "stable"
          cache: true
          pub-cache: true

      # checkout and setup-java are on their Node 24 majors (v7 / v5). The
      # Node 20 ones they replace still ran — the runner forced them onto
      # Node 24 and said so in an annotation — but only until GitHub drops
      # that fallback, at which point this workflow is what breaks. Nothing
      # in the jump touches how they are used here: `fetch-depth`,
      # `distribution` and `java-version` are unchanged, and the only
      # breaking change in either is the Node bump itself (plus a runner
      # floor of v2.327.1, far below what ubuntu-latest ships).
      #
      # checkout v7 also refuses to check out a fork's head for
      # `pull_request_target`/`workflow_run`. That cannot bite here, and for
      # the reason spelled out at the top of this file: this workflow is
      # deliberately not on `pull_request_target`.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK tools
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "::error title=Android SDK unavailable::Could not find $sdkmanager"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android build dependencies
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973"

      - run: flutter pub get --enforce-lockfile

      # The release path runs the same gate as CI rather than trusting that CI
      # ran and was green. Nothing made this job depend on that workflow, so a
      # merge landed while CI was red, still queued, or on a repo without the
      # status check required would have shipped an unverified AAB straight to
      # the alpha track. `dart`/`flutter` come from the action above, so the
      # Makefile's local-install defaults are overridden here.
      - name: Verify (format, analyze, test)
        run: make -C .. verify FLUTTER=flutter DART=dart

      - name: Validate deployment secrets
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -eu
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            PLAY_SERVICE_ACCOUNT_JSON \
            SUPABASE_URL \
            SUPABASE_ANON_KEY \
            GOOGLE_SERVICES_JSON; do
            eval "secret_value=\${$secret_name-}"
            if [ -z "$secret_value" ]; then
              echo "::error title=Missing deployment secret::$secret_name is not configured"
              exit 1
            fi
          done

      - name: Verify merged version bump
        # `github.event.before` is main's previous tip — the same commit
        # `pull_request_target` reported as the PR base. It reads as all-zeros
        # for a branch's first push (and can point at a discarded commit after
        # a force-push), so fall back to the pushed commit's own first parent.
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          base="$BEFORE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git -C .. cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git -C .. rev-parse HEAD^ 2>/dev/null || echo "")
          fi
          if [ -z "$base" ]; then
            echo "::error title=No base commit::Cannot determine what to diff the version against"
            exit 1
          fi
          make -C .. verify-version BASE_REF="$base"

      - name: Configure release signing
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/app/upload-keystore.jks
          cat > app/android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Write google-services.json
        # Required by the Google Services Gradle plugin (android/app/build.gradle.kts)
        # for FCM push notifications — gitignored locally (android/.gitignore),
        # same reasoning as key.properties: the Firebase console is the
        # source of truth, not git.
        working-directory: ${{ github.workspace }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -eu
          umask 077
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/android/app/google-services.json

      - name: Build signed Android App Bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: >-
          flutter build appbundle --release
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - name: Upload to Google Play Closed testing Alpha
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.github.tiltozavr2545.amicus
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          tracks: alpha
          status: completed

      - name: Remind to post an update from the Amicus account
        # The PR number no longer arrives in the event payload, so it is looked
        # up from the pushed commit. A push with no associated PR (a direct
        # commit to main) simply gets no comment rather than failing the
        # deploy that already succeeded.
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          version=$(awk '/^version:[[:space:]]/ { print $2; exit }' pubspec.yaml)
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty' || echo "")
          if [ -z "$pr" ]; then
            echo "No pull request associated with $SHA; skipping the reminder comment."
            exit 0
          fi
          gh pr comment "$pr" \
            --repo "$REPO" \
            --body "Deployed \`$version\` to Google Play Closed testing (alpha). Don't forget to post an update from the Amicus account if this release is worth telling people about."

      - name: Remove signing files
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          rm -f app/android/key.properties app/android/app/upload-keystore.jks
          rm -f app/android/app/google-services.json
