name: Console CI

on:
  push:
    branches: ['**']
    paths: ['console/**']
  pull_request:
    branches: [main]
    paths: ['console/**']

permissions:
  contents: read

concurrency:
  group: console-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: console

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Тесты серверной половины: `node --test` через tsx, без отдельного
      # раннера в зависимостях. Стоят перед сборкой, потому что проверяют
      # проверку, которая стоит перед service_role-ключом (server/local_only.ts)
      # — если она перестала работать, собирать уже незачем.
      - run: npm test
      - run: npm run build
