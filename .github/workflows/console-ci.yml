name: Console CI

on:
  push:
    branches: ['**']
    paths: ['console/**']
  pull_request:
    branches: [main]
    paths: ['console/**']

permissions:
  contents: read

concurrency:
  group: console-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: console

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Tests for the server half: `node --test` via tsx, with no separate
      # runner in the dependencies. They run before the build because they
      # test the check that guards the service_role key (server/local_only.ts):
      # if it has stopped working, there is no point in building.
      - run: npm test
      - run: npm run build
