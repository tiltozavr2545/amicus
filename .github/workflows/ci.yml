name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.21.0
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true
          pub-cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Verify PR version bump
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: make -C .. verify-version BASE_REF="$BASE_REF"
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Write placeholder google-services.json
        # The Google Services Gradle plugin (android/app/build.gradle.kts)
        # fails the build outright if this file is missing — it never
        # actually talks to Firebase during a build, so a structurally valid
        # placeholder is enough for CI. The real file (deploy-closed-testing.yml)
        # comes from the GOOGLE_SERVICES_JSON secret instead.
        run: |
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.github.tiltozavr2545.amicus"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "ci-placeholder-api-key" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
      - name: Build Android app bundle
        run: >-
          flutter build appbundle --release
          -PallowDebugSigning=true
          --dart-define=SUPABASE_URL=https://example.invalid
          --dart-define=SUPABASE_ANON_KEY=ci-placeholder
