# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Not Dart code: `build/` is generated, `android/`/`ios/` are the native
  # halves, where the only things the analyzer would parse are generated
  # plugin files. Came along with moving Firebase to SPM
  # (20260924, the "iOS: move Firebase from CocoaPods to Swift Package
  # Manager" entry in the CHANGELOG):
  # `flutter build ios` adds these exclusions itself.
  #
  # There must be exactly ONE `analyzer` key in this file. Git merges two
  # branches that each added their own without a conflict (the lines differ,
  # after all), and YAML answers a duplicate key by silently keeping the last
  # one: so either the exclusions or the strict modes below survive, and
  # which ones depends on the ordering. Caught on exactly such a merge.
  exclude:
    - build/**
    - android/**
    - ios/**

  # Two modes that are off by default, each of which closes off a class of
  # bugs this project has already hit at the "PostgREST row → model"
  # boundary:
  #
  #   strict-casts     — forbids implicit `dynamic` -> T. Every row from
  #                      PostgREST arrives as `Map<String, dynamic>`, and
  #                      without this mode `row['position']` silently passes
  #                      for an `int`, then crashes at runtime on the first
  #                      `num` that arrived as a `double`. Hence all the
  #                      explicit `(row['position'] as num).toInt()` in
  #                      feed_repository: the mode makes that rule mandatory
  #                      rather than a habit.
  #   strict-raw-types — forbids `List`/`Map` without type arguments, i.e.
  #                      one more way to bring `dynamic` back into code that
  #                      got rid of it.
  #
  # Both came for free: when they were enabled there wasn't a single
  # violation in the project, so this isn't paying down debt but forbidding
  # it from appearing.
  #
  # `strict-inference` is NOT enabled, and that is a decision, not an
  # oversight. It produces 20 warnings, all about a missing type argument on
  # someone else's API: `MaterialPageRoute` (an empty `<T>` on a route that
  # returns nothing) and `SupabaseClient.rpc` (13 places). The first is pure
  # ceremony. The second is worse: to write `rpc<T>`, you have to pick T from
  # the server's actual response, and a wrong pick turns into a cast failure
  # where today there is none at all; the boundary is already handled by
  # explicit `as` at the point of use. A mode that forces you to add risk in
  # order to be stricter isn't worth its cost.
  language:
    strict-casts: true
    strict-raw-types: true

  errors:
    # A forgotten `await` in this code is not a style issue. It has already
    # cost a bug: on an unexpected error the unfinished Future goes to
    # `FlutterError.onError` unhandled, and that is exactly how push-token
    # registration "quietly didn't work" (see `registerDevice`). Promoted
    # from a hint to an error.
    unawaited_futures: error
    # `context` after `await` without a `mounted` check: the thirteenth audit
    # fixed exactly this on three screens. Next time let CI fail, not the
    # screen.
    use_build_context_synchronously: error

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # Below is only what catches bugs, not what places commas: formatting is
    # left entirely to `dart format`, and style rules here would just
    # duplicate it.
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    # `discarded_futures` is deliberately NOT enabled. It complains about any
    # call returning a Future from a non-async function, i.e. about
    # `onPressed: () => _send()`, the most ordinary handler form in Flutter
    # (25 places). The dangerous case, a dropped Future in an async function
    # whose exception goes to `FlutterError.onError`, is caught by
    # `unawaited_futures` above, and it catches it without those twenty-five.
    - only_throw_errors
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements
    - use_build_context_synchronously

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
